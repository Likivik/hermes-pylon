<?xml version="1.0" encoding="UTF-8"?>
<!--
  chosen-spire-template.svg
  The shipped Pylon mark: "spire", in two tiers.

  Geometry is the approved one. Do not retune the numbers casually:
  the spike is 7.2 units wide at y=7.8 with the apex at y=1.2, and the two
  shards are triangles, not quads. An earlier 6-unit-wide spike with 4-point
  shards was rejected as a different mark.

  24x24 viewBox. Group ids are stable so the Kotlin ImageVector and the
  boot-screen SVG can be generated from this file.

  TWO TIERS, same silhouette:
    compact  - 3 paths, flat. Use below 48 dp. Faceting above ~32 px turns to
               noise, so compact is the small-size truth: the boot overlay
               (34 px), list rows, tabs, any badge under 48 dp.
    hero     - 6 paths. The spike splits into two planes, each shard into a lit
               face and a shaded face. Use at 48 dp and above: the login
               circle, the splash, the launcher icon, marketing.

  Each tier exists twice, for the two surfaces:
    *-on-primary  badge: white and lilac mark on the primary purple circle
    *-on-surface  dark surface: light mark with purple shards
  Nothing else is displayed by default; pick one group and show it.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24"
     role="img" aria-label="Pylon">

  <!-- ============ COMPACT · badge ============ -->
  <g id="spire-compact-on-primary">
    <path id="spike" d="M12 1.2 L15.6 7.8 L12 21.6 L8.4 7.8 Z" fill="#FFFFFF"/>
    <path id="shard-left"  d="M3.2 8.4 L8.8 12.2 L9.4 17.8 Z" fill="#D9CCFF"/>
    <path id="shard-right" d="M20.8 8.4 L15.2 12.2 L14.6 17.8 Z" fill="#D9CCFF"/>
  </g>

  <!-- ============ COMPACT · dark surface ============ -->
  <g id="spire-compact-on-surface" display="none">
    <path d="M12 1.2 L15.6 7.8 L12 21.6 L8.4 7.8 Z" fill="#EFE9FF"/>
    <path d="M3.2 8.4 L8.8 12.2 L9.4 17.8 Z" fill="#7C5CFF"/>
    <path d="M20.8 8.4 L15.2 12.2 L14.6 17.8 Z" fill="#7C5CFF"/>
  </g>

  <!-- ============ HERO · badge (6 paths) ============ -->
  <g id="spire-hero-on-primary" display="none">
    <!-- spike, split on the vertical axis: lit plane left, shaded plane right -->
    <path id="spike-lit"   d="M12 1.2 L15.6 7.8 L12 21.6 Z" fill="#FFFFFF"/>
    <path id="spike-shade" d="M12 1.2 L8.4 7.8 L12 21.6 Z" fill="#C9B8FF"/>
    <!-- each shard folds along its own axis into two faces -->
    <path id="shard-left-lit"    d="M3.2 8.4 L8.8 12.2 L6.3 13.1 Z" fill="#EFE9FF"/>
    <path id="shard-left-shade"  d="M6.3 13.1 L8.8 12.2 L9.4 17.8 Z" fill="#C0AAFF"/>
    <path id="shard-right-lit"   d="M20.8 8.4 L15.2 12.2 L17.7 13.1 Z" fill="#EFE9FF"/>
    <path id="shard-right-shade" d="M17.7 13.1 L15.2 12.2 L14.6 17.8 Z" fill="#C0AAFF"/>
  </g>

  <!-- ============ HERO · dark surface (6 paths) ============ -->
  <g id="spire-hero-on-surface" display="none">
    <path d="M12 1.2 L15.6 7.8 L12 21.6 Z" fill="#EFE9FF"/>
    <path d="M12 1.2 L8.4 7.8 L12 21.6 Z" fill="#9C82F5"/>
    <path d="M3.2 8.4 L8.8 12.2 L6.3 13.1 Z" fill="#7C5CFF"/>
    <path d="M6.3 13.1 L8.8 12.2 L9.4 17.8 Z" fill="#4B2FB8"/>
    <path d="M20.8 8.4 L15.2 12.2 L17.7 13.1 Z" fill="#7C5CFF"/>
    <path d="M17.7 13.1 L15.2 12.2 L14.6 17.8 Z" fill="#4B2FB8"/>
  </g>
</svg>
