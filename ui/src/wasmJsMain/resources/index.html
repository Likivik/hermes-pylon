<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Pylon</title>
    <style>
        /* Compose injects no CSS of its own and ComposeViewport sizes its canvas to
           the container (document.body here), so html/body must have a size or the
           canvas has zero area. Body must stay a plain block: making it a flex/grid
           container would size the canvas to its content instead of the viewport. */
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #101418;
        }

        /* Overlay, not a layout child, for the reason above. */
        #boot {
            position: fixed;
            inset: 0;
            display: grid;
            place-content: center;
            justify-items: center;
            gap: 10px;
            padding: 24px;
            text-align: center;
            background: #101418;
            color: #cfd8dc;
            font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
            z-index: 10;
        }

        #boot .name {
            font-size: 20px;
            font-weight: 600;
            letter-spacing: 0.02em;
        }

        #boot .hint {
            opacity: 0.6;
            max-width: 32ch;
        }

        #boot.failed {
            color: #ff8a80;
        }

        #boot.failed .hint {
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <!--
      Shown until Compose appends its canvas, which removes it. It exists for the
      one case that otherwise looks like a dead page: the wasm bundle failing to
      load or boot. Boot-stage logging was scaffolding and is gone; the failure
      message is the part worth keeping.
    -->
    <div id="boot">
        <div class="name">Pylon</div>
        <div class="hint">Loading…</div>
    </div>
    <script>
      (function () {
        var boot = document.getElementById('boot');
        function fail(detail) {
          if (!boot) return;
          boot.className = 'failed';
          // Built with textContent, not innerHTML: the detail is an error message
          // from arbitrary scripts, and interpolating it into markup would make
          // the boot overlay an injection point.
          boot.textContent = '';
          function line(className, text) {
            var node = document.createElement('div');
            node.className = className;
            node.textContent = text;
            boot.appendChild(node);
          }
          line('name', 'Pylon failed to start');
          line('hint', String(detail || 'unknown error'));
          line('hint', 'Reload the page. If it keeps happening, check the dashboard URL and its logs.');
        }
        window.__bootFail = fail;
        window.addEventListener('error', function (e) {
          fail((e.message || e.type) + (e.filename ? ' (' + e.filename + ':' + e.lineno + ')' : ''));
        });
        window.addEventListener('unhandledrejection', function (e) {
          var reason = e.reason;
          fail(reason && reason.message ? reason.message : reason);
        });
        // Compose replaces the body content when it mounts, and not every build
        // renders into a <canvas>: the wasm/skiko path here appends div layers
        // instead. "Mounted" therefore means "anything that is not our overlay or
        // a script tag", which holds for both renderers.
        function appMounted() {
          if (document.querySelector('canvas')) return true;
          var children = document.body.children;
          for (var i = 0; i < children.length; i++) {
            var el = children[i];
            if (el.id === 'boot' || el.tagName === 'SCRIPT') continue;
            return true;
          }
          return false;
        }
        var ticks = 0;
        var timer = setInterval(function () {
          if (appMounted()) {
            clearInterval(timer);
            if (boot) boot.remove();
          } else if (++ticks > 240) {
            clearInterval(timer);
            fail('the app did not start within 120 s');
          }
        }, 500);
      })();
    </script>
    <!-- The dev server serves the webpack bundle, not the raw Kotlin loader.
         webpack.config entry chunk is "main" -> output filename "ui.js" (UMD,
         library "ui"), produced from kotlin/HermesControl-ui.mjs. Loading that
         .mjs directly skips webpack, so bare npm specifiers like
         "@js-joda/core" never resolve and the page dies at boot. Plain script,
         no type="module": the output libraryTarget is umd. -->
    <script src="ui.js" onerror="window.__bootFail && window.__bootFail('ui.js failed to load')"></script>
</body>
</html>
