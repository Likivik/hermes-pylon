<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sidebar Variant A — Telegram-faithful</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
         -webkit-font-smoothing: antialiased; color: #1c1c1e; background: #f2f2f7; height: 100vh; }
  .app { display: flex; height: 100vh; }
  /* ── Sidebar (Telegram-style: wider, they hold nested folders + 2-line labels) ── */
  .sidebar { width: 268px; background: #ffffff; border-right: 1px solid #e5e5ea;
             display: flex; flex-direction: column; }
  .sidebar-head { padding: 14px 16px; border-bottom: 1px solid #f0f0f3; display:flex; align-items:center; justify-content:space-between; }
  .sidebar-head h1 { font-size: 15px; font-weight: 700; }
  .sidebar-head button { border:none; background:#eee; border-radius:8px; padding:6px 10px; font-size:12px; cursor:pointer; }
  .section-title { font-size: 11px; font-weight: 600; color: #999; text-transform: uppercase;
                   letter-spacing: .04em; padding: 12px 16px 4px; }
  .sessions { flex: 1; overflow-y: auto; padding: 6px 8px 12px; }
  /* 2-line wrapped label + transparent-icon chip */
  .row { display: flex; align-items: center; gap: 12px; padding: 9px 8px; border-radius: 10px;
         cursor: grab; position: relative; }
  .row:hover { background: #f4f4f7; }
  .row.dragging { opacity: .55; }
  .row.active { background: #e9f0ff; }
  .avatar { width: 46px; height: 46px; border-radius: 12px; display: flex; align-items: center;
            justify-content: center; font-size: 24px; flex-shrink: 0;
            background: transparent; /* transparent when an icon is set */ }
  .avatar.noicon { background: #3f7ff0; color:#fff; font-size: 18px; font-weight: 600; }
  .meta { flex: 1; min-width: 0; }
  .name { font-size: 14.5px; font-weight: 500; line-height: 1.25;
          display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .name .sub { color:#8e8e93; font-weight: 400; }
  .drag { color:#c7c7cc; font-size: 15px; cursor: grab; padding: 4px; }
  .time { font-size: 11px; color:#c7c7cc; margin-left:auto; }
  /* pinned folder hint */
  .folder { font-size: 11px; color:#8e8e93; padding: 4px 16px; }
  /* ── Chat pane ── */
  .chat { flex:1; background:#f7f7fa; display:flex; align-items:center; justify-content:center;
          color:#c7c7cc; font-size:15px; }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="sidebar-head"><h1>Hermes</h1><button>＋</button></div>
    <div class="section-title">Pinned</div>
    <div class="sessions" id="sessions">
      <div class="row active" draggable="true">
        <div class="avatar">🧠</div>
        <div class="meta"><div class="name">ADHD support<BR><span class="sub">with Hermes persona</span></div></div>
        <div class="time">now</div><div class="drag">⠿</div>
      </div>
      <div class="row" draggable="true">
        <div class="avatar">🗺️</div>
        <div class="meta"><div class="name">Plan SillyTavern alternative<BR><span class="sub">with research and…</span></div></div>
        <div class="time">2d</div><div class="drag">⠿</div>
      </div>
      <div class="section-title" style="padding-left:8px">Recent</div>
      <div class="row" draggable="true">
        <div class="avatar">🎨</div>
        <div class="meta"><div class="name">Design Agent UI<BR><span class="sub">visual system</span></div></div>
        <div class="time">1w</div><div class="drag">⠿</div>
      </div>
      <div class="row" draggable="true">
        <div class="avatar">⚙️</div>
        <div class="meta"><div class="name">Планирование серверов<BR><span class="sub">Erebus / Serenity / Traversal</span></div></div>
        <div class="time">3w</div><div class="drag">⠿</div>
      </div>
      <div class="row" draggable="true">
        <div class="avatar noicon">R</div>
        <div class="meta"><div class="name">Recipes<BR><span class="sub">no icon — auto letter</span></div></div>
        <div class="time">1m</div><div class="drag">⠿</div>
      </div>
      <div class="row" draggable="true">
        <div class="avatar">💬</div>
        <div class="meta"><div class="name">Общие заметки и идеи</div></div>
        <div class="time">2m</div><div class="drag">⠿</div>
      </div>
    </div>
  </aside>
  <main class="chat">Chat pane preview</main>
</div>
<script>
  // drag-to-reorder demo
  const rows=[...document.querySelectorAll('.row[draggable]')];
  let picked=null;
  rows.forEach(r=>{
    r.addEventListener('dragstart',e=>{ picked=r; r.classList.add('dragging'); e.dataTransfer.effectAllowed='move'; });
    r.addEventListener('dragend',()=>{ r.classList.remove('dragging'); picked=null; });
    r.addEventListener('dragover',e=>{ if(picked && picked!==r){ e.preventDefault(); const list=r.parentNode; const y=e.clientY; const after=r.getBoundingClientRect().bottom < y+15; if(after) list.insertBefore(picked, r.nextSibling); else list.insertBefore(picked, r);} });
  });
</script>
</body>
</html>
