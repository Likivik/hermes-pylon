<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sidebar C3 — reference-matched floating rail</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
         -webkit-font-smoothing: antialiased; color:#1c1c1e; height:100vh;
         /* pink wallpaper behind the frosted rail */ 
         background: radial-gradient(circle at 20% 10%, #fdd3e0 0%, transparent 50%),
                     radial-gradient(circle at 85% 90%, #f7c7d9 0%, transparent 45%),
                     linear-gradient(160deg,#fce4eb 0%,#f7cdd8 60%,#f0bfd0 100%); }
  .app { display:flex; align-items:stretch; gap:8px; height:100vh; }
  .rail { width:44px; margin-left:10px; margin-top:12px; margin-bottom:12px;
          background:rgba(255,255,255,.60); backdrop-filter:blur(18px);
          border-radius:22px; border:none; box-shadow:0 8px 30px rgba(120,60,90,.18), 0 2px 8px rgba(0,0,0,.05);
          padding:0; display:flex; flex-direction:column;
          align-self:flex-start; gap:0; line-height:0; }
  .brand { font-size:16px; margin:0; filter:grayscale(.3); }
  .it { position:relative; display:flex; flex-direction:column; align-items:center; gap:0;
        padding:0; margin:0; border-radius:0; cursor:grab; }
  /* left-edge accent bar, INSIDE rail, only for the active item */
  .it.active::before { content:""; position:absolute; left:0; top:0; bottom:0; width:3px;
                       background:#7C5CFF; } /* brand Voltage Purple */
  .it.active { background:rgba(124,92,255,.08); }
  .ic { width:44px; height:38px; border-radius:0; display:flex; align-items:center; justify-content:center;
        font-size:22px; background:transparent; padding:0; }
  .lb { font-size:9px; max-width:58px; text-align:center; line-height:1.1; color:#8f8f9a;
        display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; font-weight:500; padding:0; margin:0; }
  .it.active .lb { color:#7C5CFF; font-weight:600; }   /* selected label tints to accent */
  .badge { position:absolute; top:0; right:0; min-width:15px; height:15px; padding:0; border-radius:8px;
           background:#ff3b30; color:#fff; font-size:9px; font-weight:700; display:flex; align-items:center; justify-content:center; }
  .bar { flex:1; margin:12px 10px 12px 0; background:rgba(255,255,255,.55); backdrop-filter:blur(18px);
         border-radius:22px; box-shadow:0 8px 30px rgba(120,60,90,.12); border:1px solid rgba(255,255,255,.6);
         display:flex; align-items:center; justify-content:center; color:#b38fa0; font-size:14px; }
</style>
</head>
<body>
<div class="app">
  <nav class="rail">
    
    <div class="it"><div class="ic">💬</div><div class="lb">All</div></div>
    <div class="it"><div class="ic">🧠</div><div class="lb">ADHD support</div><span class="badge">4</span></div>
    <div class="it"><div class="ic">🦄</div><div class="lb">RP app</div><span class="badge">1</span></div>
    <div class="it active"><div class="ic">🔹</div><div class="lb">Hermes</div></div>
    <div class="it"><div class="ic">🧠</div><div class="lb">memory</div><span class="badge">2</span></div>
    <div class="it"><div class="ic">💻</div><div class="lb">serenity</div></div>
  </nav>
  <main class="bar">read-theme chat</main>
</div>
<script>
  const its=[...document.querySelectorAll('.it')]; let p=null;
  its.forEach(el=>{ el.setAttribute('draggable','true');
    el.addEventListener('dragstart',e=>{p=el;e.dataTransfer.effectAllowed='move'});
    el.addEventListener('dragover',e=>{ if(p&&p!==el){e.preventDefault();const n=el.parentNode,b=el.getBoundingClientRect();
      n.insertBefore(p, e.clientY>b.top+b.offsetHeight/2?el.nextSibling:el);}});});
  // debug: measure real vertical gaps between item blocks
  window.addEventListener('load',()=>{
    const els=[...document.querySelectorAll('.it')];
    const out=els.map((el,i)=>{ if(i===0)return null;
      const prev=els[i-1].getBoundingClientRect(), cur=el.getBoundingClientRect();
      return (cur.top-prev.bottom).toFixed(1); });
    const b=document.createElement('div');
    b.style.cssText='position:absolute;bottom:4px;left:4px;font:11px monospace;background:#333;color:#0f0;padding:4px;z-index:99';
    b.textContent='gaps:'+out.join(',');
    document.body.appendChild(b);
  });
</script>
</body>
</html>
