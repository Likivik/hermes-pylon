name: Render rail preview

on:
  push:
    tags: ['render-*']
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle (cached)
        uses: gradle/actions/setup-gradle@v4

      - name: Render Compose preview screenshots
        run: ./gradlew :app:updateScreenshotTest --no-daemon -Dorg.gradle.workers.max=2

      - name: Locate rendered images
        run: |
          echo "== PNGs under app =="
          find app -name '*.png' -print || true

      - name: Upload rendered rail PNGs
        uses: actions/upload-artifact@v5
        with:
          name: rail-render
          path: app/**/*.png
          retention-days: 14
