name: Upstream monitor (saralilyb)

on:
  schedule:
    - cron: '0 6 * * *' # 06:00 UTC daily
  workflow_dispatch:

# READ-ONLY on purpose. This job never pushes:
#   * GITHUB_TOKEN cannot push changes to .github/workflows/*, and upstream's
#     commits modify android.yml — so the merge commit is unpushable no matter
#     what `permissions:` says ("refusing to allow a GitHub App to create or
#     update workflow .github/workflows/android.yml without workflows permission").
#   * A PAT parked in repo secrets would fix that, but a long-lived broad token
#     readable by every workflow is a bigger risk than the convenience is worth.
# So: report the delta, open ONE tracking issue, and do the merge from a
# workstation as a PR that CI verifies (PR-Always). We only ever PULL from
# saralilyb; nothing is ever pushed back upstream.
permissions:
  contents: read
  issues: write

jobs:
  check:
    name: Is upstream ahead?
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch upstream main
        run: |
          git remote add upstream https://github.com/saralilyb/hermes-mobile.git
          git fetch --no-tags upstream main

      - name: Compute the delta
        id: delta
        run: |
          BEHIND=$(git rev-list --count HEAD..upstream/main)
          AHEAD=$(git rev-list --count upstream/main..HEAD)
          echo "behind=$BEHIND" >> "$GITHUB_OUTPUT"

          # Dry-run the merge (no worktree touched) to learn whether it is clean
          # and, if not, exactly which files fight. merge-tree exits non-zero on
          # conflicts.
          set +e
          git merge-tree --write-tree HEAD upstream/main > /tmp/merge-tree.txt 2>&1
          STATUS=$?
          set -e
          CONFLICTS=$(grep -E '^(  )?CONFLICT' /tmp/merge-tree.txt | sed 's/^ *//' || true)
          if [ "$STATUS" -eq 0 ]; then
            echo "clean=yes" >> "$GITHUB_OUTPUT"
            CONFLICTS=""
          else
            echo "clean=no" >> "$GITHUB_OUTPUT"
          fi
          {
            echo "conflicts<<CONFLICTS_EOF"
            echo "$CONFLICTS"
            echo "CONFLICTS_EOF"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Upstream delta"
            echo ""
            echo "- saralilyb/main is **$BEHIND** commit(s) ahead, we are $AHEAD ahead"
            echo "- dry-run merge: **$([ "$STATUS" -eq 0 ] && echo clean || echo conflicts)**"
            echo ""
            if [ -n "$CONFLICTS" ]; then
              echo '```'
              echo "$CONFLICTS"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          echo "upstream/main = $(git rev-parse --short upstream/main)"

      - name: Open or update the tracking issue
        if: steps.delta.outputs.behind != '0'
        uses: actions/github-script@v7
        env:
          BEHIND: ${{ steps.delta.outputs.behind }}
          CLEAN: ${{ steps.delta.outputs.clean }}
          CONFLICTS: ${{ steps.delta.outputs.conflicts }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const marker = '[upstream-sync]';
            const body = [
              `saralilyb/hermes-mobile moved. **This job merges nothing** — it only reports.`,
              ``,
              `- behind: **${process.env.BEHIND}** commit(s)`,
              `- dry-run merge: **${process.env.CLEAN === 'yes' ? 'clean' : 'conflicts'}**`,
              process.env.CONFLICTS ? '\n```\n' + process.env.CONFLICTS + '\n```' : '',
              ``,
              `To merge: fetch upstream/main, merge onto a branch, resolve, then open a PR into \`main\` and let CI verify.`,
            ].join('\n');

            const { data: open } = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', per_page: 100,
            });
            const existing = open.find((i) => i.title.includes(marker));
            if (existing) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: existing.number, body,
              });
            } else {
              await github.rest.issues.create({
                owner,
                repo,
                title: `${marker} saralilyb is ${process.env.BEHIND} commit(s) ahead`,
                body,
              });
            }
