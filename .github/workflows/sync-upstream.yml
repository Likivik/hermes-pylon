name: Sync upstream (saralilyb daily)

on:
  schedule:
    - cron: '0 6 * * *'  # 06:00 UTC daily
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "pylon-sync-bot"
          git config user.email "noreply@github.com"

      - name: Fetch upstream
        run: git remote add upstream https://github.com/saralilyb/hermes-mobile.git && git fetch upstream main

      - name: Merge upstream/main into our branches
        run: |
          for BR in main likivik/rail-instantswitch; do
            git checkout $BR
            if git merge --no-edit upstream/main; then
              echo "$BR: merged clean"
            else
              echo "$BR: CONFLICT — leaving unmerged, PR needed"
              git merge --abort
            fi
          done

      - name: Push clean merges
        run: |
          for BR in main likivik/rail-instantswitch; do
            # only push if branch is strictly ahead of origin (no conflict case)
            git push origin $BR || echo "$BR: push skipped (conflict or no-op)"
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
