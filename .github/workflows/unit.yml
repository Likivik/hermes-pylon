# This workflow is the SINGLE owner of unit tests — android.yml no longer runs any.
#
# SCOPE — there is now a single flavorless build with applicationId
# `io.github.likivik.pylon`. The previous `hermes`/`iris` flavor split was removed
# on 2026-10-15: the `iris` flavor's only purpose was a one-file string override
# to "Iris Mobile" (the name of an unrelated upstream product), and shipping two
# builds of the same app was not earning its keep. So there is exactly one
# variant under test here: `debug`. No variant matrix, no scheduled all-variants
# sweep — add one back deliberately if that ever changes.
#
# TRIGGERS — why push is limited to main:
#   * pull_request  — the only event that fires for a PR from a FORK (a fork push
#     happens in the fork, so this repo never sees a push event for it). Fork PR
#     runs get a read-only token and no secrets, which is the safe model. Do not
#     move this to pull_request_target.
#   * push: [main]  — post-merge verification of what actually landed. Limiting it
#     to main means a same-repo branch push does NOT also produce a push run next
#     to its pull_request run: one commit, one run.
#
# Modified from Hy4ri/hermes-mobile for this fork; see NOTICE.
name: Unit tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Keyed on the BRANCH NAME, not github.ref: github.ref is refs/pull/N/merge on a
# pull_request event and refs/heads/X on a push, so a ref-keyed group puts the same
# commit in two lanes and both runs proceed. head_ref is set only on pull_request
# events, hence the ref_name fallback. The workflow name is prefixed because group
# names are repository-wide — without it, this workflow and ktlint on the same
# branch would cancel each other.
#
# main is exempt from cancellation: a post-merge verification must not be killed by
# a faster second merge. (android.yml gets the same effect by keying main runs on
# the sha.)
concurrency:
  group: unit-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests (debug)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # The multiplatform boundary: no platform API imports in :shared/commonMain,
      # and every `expect` declaration has an `actual` in each declared target
      # source set. Sub-second and needs no JDK, so it runs first to fail fast.
      - name: Check the multiplatform boundary
        run: |
          python3 scripts/check_kmp_boundary.py
          python3 scripts/test_check_kmp_boundary.py

      # The shared data/logic layer: ChatViewModel reducers, rail grouping + order
      # persistence, rename fast-path. JUnit + Robolectric, ~7 min.
      - name: Run unit tests (debug)
        run: ./gradlew testDebugUnitTest --no-daemon -Dorg.gradle.workers.max=2

      # The wasmJs target is the only non-JVM runtime :shared/commonMain is
      # exercised on, and it runs the same commonTest sources through karma in a
      # browser. Compiling them is not enough: a JVM-only assumption in
      # commonMain (e.g. relying on an unchecked array read to raise) only
      # surfaces once the tests actually execute. ubuntu-latest ships Chrome, so
      # karma's default ChromeHeadless works here — the dev boxes, which do not
      # have Chrome, pass -PwasmTestBrowser=firefox via scripts/local-tests.sh
      # `wasm`.
      - name: Install yarn for the wasm toolchain
        run: |
          npm install --global yarn
          yarn --version

      - name: Run :shared wasmJs tests
        run: ./gradlew :shared:wasmJsBrowserTest --no-daemon -Dorg.gradle.workers.max=2

      - name: Upload unit test reports
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
          retention-days: 14

      - name: Upload wasm test reports
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: wasm-test-reports
          path: shared/build/reports/tests/
          retention-days: 14
