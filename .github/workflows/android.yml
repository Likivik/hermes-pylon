# Modified from Hy4ri/hermes-mobile for this fork; see NOTICE.
#
# SCOPE — the IRIS flavor only (`sh.slb.irismobile`).
# Iris is the flavor this fork ships: apk.yml defaults to it, the E2E suite drives
# it, and every APK delivered to the device has been an iris build. `hermes` is the
# upstream identity (`sh.slb.hermesmobile`) and is deliberately NOT built or tested
# here — Likivik, 2026-10-05: "for now we only ever want to test our own flavor and
# nothing else." The hermes flavor still EXISTS in app/build.gradle.kts so upstream
# merges keep applying; it is simply not part of CI. Add a variant back deliberately
# if that changes.
#
# COST — what runs when:
#   every PR   : ktlint, Android Lint, Build Debug APK, Release Compile (all iris)
#   PR + label : add the `full-ci` label to also run Instrumented Tests
#   push main  : everything, including Instrumented Tests (post-merge verification)
#   tags       : everything (apk-*/e2e-*/robo-*/render-* workflows are separate)
# Instrumented Tests are the slowest job (emulator boot dominates: 6.7 min of a
# 7.3 min job) and were the whole critical path of this workflow, so they are
# opt-in on PRs rather than always-on. Unit tests are owned by unit.yml.

name: Android CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel in-progress runs when a new commit lands on the same PR branch.
# On main (push events), each commit gets a unique group so rapid merges
# don't cancel each other's CI runs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────────────────────────────
  # Job 1: ktlint (code style) — fastest feedback, runs in parallel.
  # ─────────────────────────────────────────────────────────────────────
  ktlint:
    name: ktlint — Code Style
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6
        with:
          validate-wrappers: true
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTED_KEY }}

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      # ktlint is NOT installed here any more. It comes from the Gradle plugin
      # with the engine version pinned in gradle/libs.versions.toml, so the CI
      # verdict and a local ./gradlew ktlintCheck use the same engine rather
      # than "whatever ktlint is on PATH".

      - name: Run ktlintCheck
        run: ./gradlew ktlintCheck

      - name: Run checkColorLiterals (hardcoded Color guard, issue #622)
        run: ./gradlew checkColorLiterals

      - name: Upload ktlint reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ktlint-reports
          path: |
            app/build/reports/ktlint/
            build/reports/ktlint/
          if-no-files-found: ignore
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────
  # Job 2: Android Lint (static analysis) — runs in parallel with ktlint.
  # Depends on compileDebugKotlin, so it also catches unresolved refs.
  # ─────────────────────────────────────────────────────────────────────
  android-lint:
    name: Android Lint — Static Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6
        with:
          validate-wrappers: true
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTED_KEY }}

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      # iris only, per the SCOPE note at the top — this was lintHermesDebug
      # lintIrisDebug, i.e. two near-identical lint passes in one 6.2 min step.
      - name: Run debug lint
        run: ./gradlew lintIrisDebug

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: lint-reports
          # Flavor-qualified since the hermes/iris split: lint-results-irisDebug.*
          path: app/build/reports/lint-results-*
          if-no-files-found: error
          retention-days: 7

  # Unit tests are deliberately NOT run here: unit.yml owns them, runs on every
  # push and every PR (including PRs into main), and covers the same irisDebug
  # variant this job used to duplicate.
  #
  # What this job used to do: `./gradlew test` — the same 1,025 tests for all four
  # variants (hermes/iris × debug/release) in ~16 min, which made it the critical
  # path of this ~21 min workflow. Three of those four variants were near-copies
  # (the flavours differ only by applicationId), and none of them is the iris
  # flavour we ship.

  # ─────────────────────────────────────────────────────────────────────
  # Job 4: Build Debug APK — depends on ktlint + lint passing.
  # ─────────────────────────────────────────────────────────────────────
  build:
    name: Build Debug APK
    needs: [ktlint, android-lint]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6
        with:
          validate-wrappers: true
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTED_KEY }}

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build debug APK (iris)
        run: ./gradlew assembleIrisDebug

      - name: Upload Debug APK Artifact
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: hermescontrol-debug-apk
          path: app/build/outputs/apk/iris/debug/*.apk
          if-no-files-found: error
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────
  # Job 5: Release Compile — verifies the iris release variant compiles.
  # Catches issues like debugImplementation-scoped dependencies that
  # main source code depends on (e.g. okhttp3.logging.HttpLoggingInterceptor).
  # debug-only CI jobs (ktlint, lint, tests) won't catch these.
  # ─────────────────────────────────────────────────────────────────────
  release-compile:
    name: Release Compile Check
    needs: [ktlint, android-lint]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6
        with:
          validate-wrappers: true
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTED_KEY }}

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Compile release Kotlin (iris)
        run: |
          ./gradlew compileIrisReleaseKotlin

  # ─────────────────────────────────────────────────────────────────────
  # Job 6: Instrumented tests — Android emulator, iris only, OPT-IN on PRs.
  # Required for Compose UI tests (TEST-09, TEST-14) and Navigation3 tests
  # that need a real Activity lifecycle. Cannot run on JVM.
  # ─────────────────────────────────────────────────────────────────────
  instrumented-tests:
    name: Instrumented Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The emulator is the slowest thing in this repo's CI — boot dominates the job
    # (6.7 min of 7.3), and it was therefore the entire critical path of the PR
    # gate. So it does not run on every PR any more; it runs:
    #   * post-merge, on push to main (that is what verifies what actually landed),
    #   * on tags and on manual dispatch,
    #   * and on a PR that carries the `full-ci` label, when you want the UI
    #     coverage before merging.
    # A skipped job here is fine: ci-summary knows to ignore `skipped` for exactly
    # this job, so skipping cannot turn the gate red.
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6
        with:
          validate-wrappers: true
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTED_KEY }}

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      # Enable KVM hardware acceleration on the Linux runner
      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Cache the AVD to avoid downloading/recreating it from scratch every time
      - name: AVD Cache
        id: avd-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-api34-atd-x86_64

      - name: Run connectedIrisDebugAndroidTest
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 34
          target: aosp_atd
          arch: x86_64
          disable-animations: true
          force-avd-creation: false
          emulator-options: -no-window -no-audio -no-boot-anim -camera-back none -memory 2048
          # iris only (see the SCOPE note at the top): this used to run the hermes
          # variant first, which is the upstream identity and not what we ship.
          #
          # `com.m57.hermescontrol.e2e` is excluded on purpose: those 8 classes drive a
          # REAL Hermes gateway and get an ephemeral password from e2e.yml's setup.
          # Without it they throw "e2ePassword not set", which is the correct loud
          # failure for "E2E executed without a gateway".
          script: |
            ./gradlew connectedIrisDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.notPackage=com.m57.hermescontrol.e2e

      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: androidTest-reports
          path: app/build/reports/androidTests/
          if-no-files-found: ignore
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────
  # Job 7: PR status summary — aggregates all checks.
  # ─────────────────────────────────────────────────────────────────────
  ci-summary:
    name: CI Summary
    needs:
      - ktlint
      - android-lint
      - build
      - release-compile
      - instrumented-tests
    runs-on: ubuntu-latest
    timeout-minutes: 2
    if: always()
    steps:
      - name: Check job results
        env:
          KTLINT_RESULT: ${{ needs.ktlint.result }}
          LINT_RESULT: ${{ needs.android-lint.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          RELEASE_COMPILE_RESULT: ${{ needs.release-compile.result }}
          INSTRUMENTED_RESULT: ${{ needs.instrumented-tests.result }}
        run: |
          FAILED=0
          for entry in \
            "ktlint:$KTLINT_RESULT" \
            "android-lint:$LINT_RESULT" \
            "build:$BUILD_RESULT" \
            "release-compile:$RELEASE_COMPILE_RESULT" \
            "instrumented-tests:$INSTRUMENTED_RESULT"; do
            name="${entry%%:*}"
            result="${entry#*:}"
            echo "::notice::$name = $result"
            # instrumented-tests is skipped by design on PRs without the full-ci
            # label. Every other job must have actually passed.
            if [[ "$name" == "instrumented-tests" && "$result" == "skipped" ]]; then
              continue
            fi
            if [[ "$result" != "success" ]]; then
              FAILED=1
            fi
          done
          if [[ "$FAILED" -eq 1 ]]; then
            echo "::error::CI failed — check individual job logs"
            exit 1
          fi
          echo "All CI jobs passed ✅"
