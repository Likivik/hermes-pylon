# Modified from Hy4ri/hermes-mobile for this fork; see NOTICE.

name: CodeQL Analysis

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '30 3 * * 1'
  workflow_dispatch:

concurrency:
  group: >-
    codeql-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze Java and Kotlin
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: >-
          actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Set up JDK 21
        uses: >-
          actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: >-
          gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6
        with:
          validate-wrappers: true
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTED_KEY }}

      - name: Initialize CodeQL
        uses: >-
          github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2
        with:
          languages: java-kotlin
          build-mode: manual

      - name: Compile the iris debug sources
        run: |
          # iris only: it is the flavor this fork ships (sh.slb.irismobile). The
          # analyzed source set is shared, so hermes added a second compile of the
          # same code under a different applicationId and nothing else.
          ./gradlew \
            compileIrisDebugSources \
            --no-daemon \
            --max-workers=1 \
            --no-build-cache

      - name: Perform CodeQL analysis
        uses: >-
          github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2
        with:
          category: /language:java-kotlin
