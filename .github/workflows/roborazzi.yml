name: Roborazzi renders

on:
  push:
    tags:
      - 'robo-*'
  workflow_dispatch:

jobs:
  record-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # Record fresh goldens for both flavors; verify-gate comes after baselines settle.
      - name: Record Roborazzi captures (hermes + iris)
        run: |
          ./gradlew recordRoborazziHermesDebug --stacktrace
          ./gradlew recordRoborazziIrisDebug --stacktrace

      - name: Upload renders
        uses: actions/upload-artifact@v4
        with:
          name: roborazzi-renders
          path: |
            app/src/test/assets/roborazzi/**/*.png
            app/build/outputs/roborazzi/**/*.png
          if-no-files-found: warn
          retention-days: 30
