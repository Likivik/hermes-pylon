name: Roborazzi renders

on:
  push:
    tags:
      - 'robo-*'
  workflow_dispatch:

jobs:
  record-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # Record fresh goldens for the iris flavor only — the one this fork ships;
      # verify-gate comes after baselines settle.
      #
      # This used to record hermes FIRST. hermes is the upstream identity, not a
      # flavor we support, and the most likely reason this workflow has been failing
      # since 2026-09-14 is that `recordRoborazziHermesDebug` aborted the step before
      # iris ever ran. If a robo-* tag run still fails on iris alone, this workflow
      # is stale and should be deleted rather than kept red.
      - name: Record Roborazzi captures (iris)
        run: |
          ./gradlew recordRoborazziIrisDebug --stacktrace

      - name: Upload renders
        uses: actions/upload-artifact@v4
        with:
          name: roborazzi-renders
          path: |
            app/src/test/assets/roborazzi/**/*.png
            app/build/outputs/roborazzi/**/*.png
          if-no-files-found: warn
          retention-days: 30
