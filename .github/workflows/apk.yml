name: Build signed APK

on:
  push:
    branches: ['likivik/**', 'main']
  workflow_dispatch:
    inputs:
      flavor:
        description: 'Flavor to build (iris = default | hermes | all)'
        required: false
        default: 'iris'
        type: choice
        options: [iris, hermes, all]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle (cached)
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APKs
        env:
          FLAVOR: ${{ github.event.inputs.flavor || 'iris' }}
        # FLAVOR is a workflow-input enum (all|hermes|iris), never free text — no injection risk
        run: |
          case "$FLAVOR" in
            hermes) TASKS="assembleHermesRelease" ;;
            iris)   TASKS="assembleIrisRelease" ;;
            *)      TASKS="assembleRelease" ;;
          esac
          ./gradlew $TASKS --no-daemon -Dorg.gradle.workers.max=2

      - name: Sign APKs
        env:
          KS_BASE64: ${{ secrets.APK_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.APK_KEYSTORE_PASSWORD }}
        run: |
          echo "$KS_BASE64" | base64 -d > /tmp/keystore.jks
          for apk in app/build/outputs/apk/*/release/*-unsigned.apk; do
            aligned="${apk%-unsigned.apk}-aligned.apk"
            signed="${apk%-unsigned.apk}-signed.apk"
            $ANDROID_HOME/build-tools/36.0.0/zipalign -f 4 "$apk" "$aligned"
            $ANDROID_HOME/build-tools/36.0.0/apksigner sign \
              --ks /tmp/keystore.jks --ks-pass pass:"$KS_PASS" \
              --out "$signed" "$aligned"
          done
          rm -f /tmp/keystore.jks

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hermes-pylon-apks
          path: app/build/outputs/apk/*/release/*-signed.apk
          retention-days: 90
