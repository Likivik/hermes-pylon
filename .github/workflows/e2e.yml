name: E2E (Espresso + Gradle Managed Device)

on:
  push:
    tags:
      - 'e2e-*'
  workflow_dispatch:

jobs:
  rename-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # GMD: AGP provisions, boots, installs, runs, tears down the emulator.
      # Gradle's exit code fails when tests fail (no am-instrument trap).
      # swiftshader_indirect: GitHub runners have no hardware GPU.
      - name: Run E2E on Gradle Managed Device (Pixel 5, API 34)
        run: >
          ./gradlew e2eApi34IrisDebugAndroidTest --no-daemon
          -Dorg.gradle.workers.max=2
          -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect

      - name: Upload instrumented results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: app/build/outputs/androidTest-results/**/*.xml
          retention-days: 14
