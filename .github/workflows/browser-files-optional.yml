# Optional. Manual dispatch only - never runs on push, never a required check.
name: Browser files check (optional)

on:
  workflow_dispatch:

jobs:
  files:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build the web bundle
        run: ./gradlew :ui:wasmJsBrowserDistribution -x kotlinWasmBinaryenSetup

      - name: Start the seeded pod
        env:
          PYLON_TEST_DIST: ${{ github.workspace }}/ui/build/dist/wasmJs/productionExecutable
          PYLON_TEST_IMAGE: docker.io/nousresearch/hermes-agent@sha256:1a355ebc8981a4b72a28f4e47e347ba4f0f172b43dc876e5768d175a07c67b22
        run: |
          mkdir -p "$PYLON_TEST_DIST"
          podman --version
          bash deploy/test/pod.sh up

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Playwright
        working-directory: deploy/test/browser
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Run the Files transport check
        working-directory: deploy/test/browser
        env:
          PYLON_URL: http://127.0.0.1:19119
          PYLON_USER: seed
          PYLON_PASSWORD: ${{ secrets.PYLON_TEST_PASSWORD }}
        run: npm test

      - name: Pod state on failure
        if: failure()
        run: podman pod ps && podman logs pylon-test-dashboard 2>&1 | tail -50 || true

      - name: Stop the pod
        if: always()
        run: bash deploy/test/pod.sh down || true
