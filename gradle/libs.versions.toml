junit5 = "6.1.3"
junitPlatform = "6.1.3"
kotlin = "2.4.21"
screenshot = "0.0.1-alpha15"
roborazzi-plugin = "1.77.0"
# standalone per KSP 2.0+ guidance — NOT kotlinVersion-kspVersion; easy
# to miss during Kotlin upgrades since it no longer tracks the Kotlin version.
ksp = "2.3.12"
nav3Core = "1.0.1"
lifecycleViewmodelNav3 = "2.10.0"
leakcanary = "2.14"
okhttp = "5.5.1"
securityCrypto = "1.1.0"
mockk = "1.14.11"
turbine = "1.2.1"
coil = "3.6.3"
room = "2.8.5"
sqlcipher = "4.19.1"
datastore = "1.3.0"
latex = "1.6.3"
reorderable = "3.1.0"
roborazzi = "1.77.0"
robolectric = "4.17"
# ktlint: the plugin version and the engine version are separate pins on
# purpose. The plugin default engine changes between plugin releases, which
# is how CI and local runs drift apart on a required check.
ktlintPlugin = "14.2.0"
ktlintEngine = "1.2.1"
ktor = "3.6.0"
# Compose Multiplatform — Phase 2 of the CMP plan. The plugin id
# `org.jetbrains.compose` ships from `compose-gradle-plugin:1.12.2` and is the
# plugin that wires every `org.jetbrains.compose.*` runtime artifact; the
# Kotlin-side `compose-compiler` alias above is the *companion* compiler plugin
# that tells the Kotlin toolchain to treat commonMain as Compose-using.
# 1.12.2 needs Kotlin >= 2.1; this repo pins 2.4.21.
composeMultiplatform = "1.12.2"
# Material3 is on its own line that lags the platform release. The release
# table in CMP 1.12.2 pins `material3*:1.12.0-alpha03` and the navigation-suite
# chrome shares that version. Pinning it separately avoids pulling a phantom
# `material3:1.12.2` that does not exist.
composeMaterial3 = "1.13.0-beta01"
# The CMP adaptive fork is published under `org.jetbrains.compose.material3.adaptive`,
# not under `androidx.compose.material3.adaptive`. 1.3.0 is the latest stable
# (2026-10-06) and matches the version table in CMP 1.12.2.
composeAdaptive = "1.3.0"
# Skiko native runtime for the jvmTest tier. CMP 1.12.2 requires Skiko 0.150.2
# (declared transitively by org.jetbrains.compose.ui:ui), but the native
# `libskiko-*.so` binary is NOT shipped by `ui-test` — it has to be pulled
# in separately per-host (linux-x64 here). Without this, `runComposeUiTest`
# throws `LibraryLoadException: Cannot find libskiko-linux-x64.so.sha256`
# before the composable even runs.
skiko = "0.156.0"

