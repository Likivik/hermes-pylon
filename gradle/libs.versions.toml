# Ktor: multiplatform HTTP primitives and client.
# ktor-http is the common artifact that exposes `io.ktor.http.Url`, used by
# :shared for multiplatform URL parsing. The ktor-client-* family is the
# multiplatform replacement for Retrofit/OkHttp being introduced in Phase 4.
ktor-http = { module = "io.ktor:ktor-http", version.ref = "ktor" }
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-websockets = { module = "io.ktor:ktor-client-websockets", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-client-logging = { module = "io.ktor:ktor-client-logging", version.ref = "ktor" }
ktor-client-engine-defaults = { module = "io.ktor:ktor-client-engine-defaults", version.ref = "ktor" }
# Platform engines. The OkHttp engine can be driven by an externally-owned
# OkHttpClient, which lets Phase 4 reuse the existing cookie jar, TLS pinning,
# connection pool and 401 authenticator while Retrofit is still live.
#   androidMain/jvmMain -> ktor-client-okhttp (shares OkHttpProvider's client)
#   jvmMain (console)   -> ktor-client-cio    (no OkHttp dependency at all)
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-cio = { module = "io.ktor:ktor-client-cio", version.ref = "ktor" }
ktor-client-js = { module = "io.ktor:ktor-client-js", version.ref = "ktor" }
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }

# Compose Multiplatform runtime — multiplatform republish of the Jetpack Compose
# libraries. Group differs from `androidx.compose.*`; in CMP 1.12.x these are
# literally the same artifact coordinates repackaged for the JVM/Android target
# so types merge at compile time on Android.
# Phase 2 proof uses a minimal set: runtime, ui, foundation, material3. The
# adaptive fork splits into four so commonMain only declares what it actually
# references (the layout primitives live in `adaptive-layout`; nav chrome in
# `adaptive-navigation` / `adaptive-navigation3`; the umbrella `adaptive` pulls
# everything in for callers that don't want to choose).
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "composeMultiplatform" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "composeMultiplatform" }
compose-ui-tooling-preview = { module = "org.jetbrains.compose.ui:ui-tooling-preview", version.ref = "composeMultiplatform" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "composeMultiplatform" }
compose-foundation-layout = { module = "org.jetbrains.compose.foundation:foundation-layout", version.ref = "composeMultiplatform" }
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "composeMaterial3" }
# `material3-adaptive-navigation-suite` is the nav chrome (NavigationSuiteScaffold);
# it depends on the four `adaptive*` artifacts below transitively, but pinning
# each one lets commonMain reason about exactly what it imports. Shares the
# Material3 version line above (lagging the platform release).
compose-material3-adaptive-navigation-suite = { module = "org.jetbrains.compose.material3:material3-adaptive-navigation-suite", version.ref = "composeMaterial3" }
compose-adaptive = { module = "org.jetbrains.compose.material3.adaptive:adaptive", version.ref = "composeAdaptive" }
compose-adaptive-layout = { module = "org.jetbrains.compose.material3.adaptive:adaptive-layout", version.ref = "composeAdaptive" }
compose-adaptive-navigation = { module = "org.jetbrains.compose.material3.adaptive:adaptive-navigation", version.ref = "composeAdaptive" }
compose-adaptive-navigation3 = { module = "org.jetbrains.compose.material3.adaptive:adaptive-navigation3", version.ref = "composeAdaptive" }
# `ui-test` provides `runComposeUiTest` for commonTest (multiplatform). On the
# JVM target it runs Skiko headless; on Android it needs the androidx
# ui-test-junit4 driver in androidTest. We declare only the multiplatform one
# here so the proof test compiles against commonMain.
compose-ui-test = { module = "org.jetbrains.compose.ui:ui-test", version.ref = "composeMultiplatform" }
# Skiko native runtime for the jvmTest tier. The compile-time `ui-test`
# artifact is platform-agnostic, but the test runtime needs the native
# `libskiko-*.so` binary on the classpath — `ui-test` doesn't bring it.
# Host: linux-x64 (the build agent is Linux). For a portable test setup
# this should be selected by `System.getProperty("os.name")`; that is
# outside the scope of this Phase 2 toolchain proof.
skiko-awt-runtime-linux-x64 = { module = "org.jetbrains.skiko:skiko-awt-runtime-linux-x64", version.ref = "skiko" }

[plugins]
android-application = { id = "com.android.application", version.ref = "androidGradlePlugin" }
android-kotlin-multiplatform-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "androidGradlePlugin" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
# CMP plugin — declares runtime artifact versions and configures Kotlin Compose
# Compiler for every KMP target. Declared ONCE here at the root with
# `apply false` (the hermes-pylon rule: every plugin version lives at the root,
# modules apply by alias only).
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
room = { id = "androidx.room", version.ref = "room" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
screenshot = { id = "com.android.compose.screenshot", version.ref = "screenshot" }
roborazzi = { id = "io.github.takahirom.roborazzi", version.ref = "roborazzi-plugin" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlintPlugin" }
atomicfu = { id = "org.jetbrains.kotlinx.atomicfu", version.ref = "atomicfu" }